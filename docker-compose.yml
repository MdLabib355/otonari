# Everything at once:  docker compose up
# Then open http://localhost:8088  (another port:  OTONARI_PORT=9000 docker compose up)
# The server fills an empty database with the demo data. Start again from zero:  docker compose down -v

name: otonari

services:
  db:
    image: postgres:17-alpine
    environment:
      # Not a secret: this database can only be reached from the containers below.
      POSTGRES_USER: otonari
      POSTGRES_PASSWORD: otonari
      POSTGRES_DB: otonari
    volumes:
      - accounts_database:/var/lib/postgresql/data
    healthcheck:
      # 127.0.0.1: while the image sets itself up, it answers only on its local socket.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U otonari -d otonari']
      interval: 2s
      timeout: 5s
      retries: 30
    restart: on-failure

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    init: true # stops immediately on Ctrl+C
    # docker.env: a super admin to try out. Your own settings (email, Google, super admin) in server/.env win.
    env_file:
      - path: server/docker.env
      - path: server/.env
        required: false
    environment:
      PORT: 3001
      DEMO_MODE: 'true'
      DATABASE_URL: postgres://otonari:otonari@db:5432/otonari
    volumes:
      - photos:/app/server/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/health']
      interval: 2s
      timeout: 5s
      retries: 30
    restart: on-failure

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '${OTONARI_PORT:-8088}:80'
    depends_on:
      server:
        condition: service_healthy
    restart: on-failure

volumes:
  accounts_database: # not "database": that one is from before there were accounts
  photos:
