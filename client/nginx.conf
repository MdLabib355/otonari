server {
  listen 80;
  root /usr/share/nginx/html;

  # Photos are up to 5 MB; the server itself refuses larger ones with a clear message.
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json;

  # The address of the server container is looked up again after it has been restarted.
  resolver 127.0.0.11 valid=5s;
  set $api http://server:3001;

  location ~ ^/(api|uploads)/ {
    proxy_pass $api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The names of these files change with their content, so browsers may keep them.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything else, e.g. /join?code=SAKURA-2611 from the QR poster: React Router shows the right page.
  # "no-cache" = always ask for the newest version first.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
