name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: otonari
          POSTGRES_PASSWORD: otonari
          POSTGRES_DB: otonari_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U otonari -d otonari_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts && npm ci --prefix server && npm ci --prefix client

      - name: Run automated test suite (PostgreSQL + API + Manager + Notifications + OpenAPI + i18n)
        env:
          DATABASE_URL: postgres://otonari:otonari@localhost:5432/otonari_test
          DEMO_MODE: "true"
        run: npm test

      - name: Build production PWA client & custom Push Service Worker
        run: npm run build
